<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafeteria Viktor</title>
    <link
      rel="icon"
      href="styles/images/favicon.png"
      type="image/png"
      sizes="18x18"
    />
    <link rel="stylesheet" href="/styles/styles.css" />
    <script src="scripts/Script.js"></script>
  </head>
  <body>
    <header>
      <section class="main_bar">
        <div id="main_logo">
          <h1 class="text" onclick="go_to_main()">Cafeteria Viktor</h1>
        </div>
        <a href="" class="shopping_bttn"
          ><img src="/styles/images/shopping_car.png" alt="shopping_img"
        /></a>
        <span class="nav_bar">
          <a href="index.html" class="nav_bttn">Inicio</a>
          <a href="catalogo_pedidos.html" class="nav_bttn"
            >Catalogo de Pedidos</a
          >
          <a href="catalogo_caterin.html" class="nav_bttn"
            >Catalogo de Catering</a
          >
          <a href="sobre_nosotros.html" class="nav_bttn">Sobre Nosotros</a>
        </span>
        <div class="main_bar_link_pedidos">
          <h2 class="main_text">ORDENA ALGO DE YA PARA YA!</h2>
          <a href="catalogo_pedidos.html" class="main_bar_bttn_pedidos"
            >Pedir!</a
          >
        </div>
      </section>
    </header>

    <main id="main">
      <section class="main_slide_container">
        <article class="slider">
          <div id="text_over_img">
            <p class="over_text" id="over_name">Nombre Plato</p>
            <p class="over_text" id="over_description">Descripcion</p>
            <div id="over_color"></div>
          </div>
          <div class="main_img_container">
            <img alt="Catering_img" id="slider_img" />
          </div>
        </article>
        <div class="dot_nav">
          <div class="dot_container">
            <div class="individual_dot_container">
              <div class="dot"></div>
            </div>
            <div class="individual_dot_container">
              <div class="dot"></div>
            </div>
            <div class="individual_dot_container">
              <div class="dot"></div>
            </div>
            <div class="individual_dot_container">
              <div class="dot"></div>
            </div>
            <div class="individual_dot_container">
              <div class="dot"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div id="logo_foot_container">
        <img id="logo" src="styles/images/cooker_family.jpeg" />
      </div>
      <div id="footer_boxes">
        <div class="footer_box" id="Social_box">
          Nuestras Redes sociales
          <p class="network_info"><a href="">Instagram</a></p>
          <p class="network_info"><a href="">Tiktok</a></p>
        </div>
        <div class="footer_box" id="Contact_box">Preguntas Frecuentes</div>
        <div class="footer_box" id="FEQ_box">Contactenos</div>
      </div>
    </footer>
  </body>
</html>
